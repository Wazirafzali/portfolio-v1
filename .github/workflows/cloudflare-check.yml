name: Cloudflare compatibility check
on:
  push:
    branches: [codex/cloudflare-preparation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      # Public Cloudflare test key, only for this unpublished build check.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/contact-input.test.mjs
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --outdir .worker-check
      - name: Check Worker pages and contact validation locally
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/appfolor-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ -o /tmp/appfolor-home.html; then break; fi
            sleep 2
          done
          grep -q 'AppFolor' /tmp/appfolor-home.html
          curl -fsS http://127.0.0.1:8787/projects/meadlearna -o /tmp/appfolor-project.html
          grep -q 'Meadlearna' /tmp/appfolor-project.html
          curl -fsS http://127.0.0.1:8787/privacy > /dev/null
          curl -fsS http://127.0.0.1:8787/terms > /dev/null
          curl -fsS http://127.0.0.1:8787/sitemap.xml -o /tmp/appfolor-sitemap.xml
          grep -q 'meadlearna' /tmp/appfolor-sitemap.xml
          status=$(curl -sS -o /tmp/appfolor-contact.json -w '%{http_code}' -H 'Content-Type: application/json' --data '{' http://127.0.0.1:8787/api/contact)
          test "$status" = 400
